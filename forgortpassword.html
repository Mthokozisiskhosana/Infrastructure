<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Portal - Reset Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 35px;
            text-align: center;
        }

        .header h1 { font-size: 28px; margin-bottom: 6px; }
        .header p  { opacity: 0.9; font-size: 14px; }

        .form-body { padding: 30px 25px; }

        .step {
            display: none;
        }
        .step.active {
            display: block;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
        }

        .step-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.3s;
        }

        .step-dot.active   { background: #2a5298; transform: scale(1.3); }
        .step-dot.done     { background: #27ae60; }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 13px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
        }

        .password-wrap { position: relative; }

        .toggle-pw {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            font-size: 13px;
            font-weight: 500;
            user-select: none;
        }

        .toggle-pw:hover { color: #2a5298; }

        .strength-meter {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .strength-label {
            font-size: 11px;
            margin-top: 4px;
            color: #888;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .alert.show   { display: block; }
        .alert-error  { background: #fee; color: #c33; border: 1px solid #fcc; }
        .alert-success{ background: #efe; color: #3a3; border: 1px solid #cfc; }
        .alert-info   { background: #f0f7ff; color: #004085; border: 1px solid #cce5ff; }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30,60,114,0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: #f0f0f0;
            color: #444;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-secondary:hover { background: #e0e0e0; }

        .success-icon {
            text-align: center;
            font-size: 64px;
            margin-bottom: 16px;
        }

        .success-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 8px;
        }

        .success-msg {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2a5298;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 6px;
        }

        .section-sub {
            font-size: 13px;
            color: #666;
            margin-bottom: 22px;
        }

        @media (max-width: 480px) {
            .container { border-radius: 0; min-height: 100vh; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Community Portal</h1>
        <p>Reset your password</p>
    </div>

    <div class="form-body">

        <!-- Step indicators -->
        <div class="step-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot"        id="dot2"></div>
            <div class="step-dot"        id="dot3"></div>
        </div>

        <!-- ── STEP 1: Enter Email ── -->
        <div class="step active" id="step1">
            <div class="section-title">Forgot Password?</div>
            <div class="section-sub">Enter the email linked to your account.</div>

            <div class="alert alert-error" id="s1Error"></div>

            <div class="form-group">
                <label for="fpEmail">Email Address</label>
                <input type="email" id="fpEmail" placeholder="your@email.com" autocomplete="email">
            </div>

            <button class="btn" id="s1Btn" onclick="checkEmail()">Continue</button>
            <a href="login.html" class="back-link">← Back to Sign In</a>
        </div>

        <!-- ── STEP 2: New Password ── -->
        <div class="step" id="step2">
            <div class="section-title">Set New Password</div>
            <div class="section-sub" id="s2Sub">Choose a strong new password.</div>

            <div class="alert alert-error"   id="s2Error"></div>
            <div class="alert alert-info"    id="s2Info"></div>

            <div class="form-group">
                <label for="fpNewPass">New Password</label>
                <div class="password-wrap">
                    <input type="password" id="fpNewPass" placeholder="Min 8 characters"
                           oninput="checkStrength(this.value)" autocomplete="new-password">
                    <span class="toggle-pw" onclick="togglePw('fpNewPass', this)">Show</span>
                </div>
                <div class="strength-meter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>

            <div class="form-group">
                <label for="fpConfirm">Confirm New Password</label>
                <div class="password-wrap">
                    <input type="password" id="fpConfirm" placeholder="Repeat new password"
                           autocomplete="new-password">
                    <span class="toggle-pw" onclick="togglePw('fpConfirm', this)">Show</span>
                </div>
            </div>

            <button class="btn" id="s2Btn" onclick="resetPassword()">Reset Password</button>
            <button class="btn-secondary" onclick="goStep(1)">← Back</button>
        </div>

        <!-- ── STEP 3: Success ── -->
        <div class="step" id="step3">
            <div class="success-icon">✅</div>
            <div class="success-title">Password Reset!</div>
            <div class="success-msg">
                Your password has been updated successfully.<br>
                You can now sign in with your new password.
            </div>
            <button class="btn" onclick="window.location.href='login.html'">Go to Sign In</button>
        </div>

    </div>
</div>

<script>
    const API_BASE = "http://localhost:3000";
    let confirmedEmail = "";

    // ── Navigation ──────────────────────────────────────────────
    function goStep(n) {
        document.querySelectorAll('.step').forEach((s, i) => {
            s.classList.toggle('active', i + 1 === n);
        });
        document.querySelectorAll('.step-dot').forEach((d, i) => {
            d.classList.remove('active', 'done');
            if (i + 1 < n)  d.classList.add('done');
            if (i + 1 === n) d.classList.add('active');
        });
    }

    // ── Step 1: Check email exists ───────────────────────────────
    async function checkEmail() {
        const email  = document.getElementById('fpEmail').value.trim();
        const errBox = document.getElementById('s1Error');
        const btn    = document.getElementById('s1Btn');

        errBox.classList.remove('show');

        if (!email) {
            errBox.textContent = 'Please enter your email address.';
            errBox.classList.add('show');
            return;
        }

        btn.disabled    = true;
        btn.textContent = 'Checking...';

        try {
            const res  = await fetch(`${API_BASE}/check-email`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email })
            });
            const data = await res.json();

            if (res.ok) {
                confirmedEmail = email;
                document.getElementById('s2Sub').textContent =
                    `Setting new password for: ${email}`;
                goStep(2);
            } else {
                errBox.textContent = data.message || 'Email not found.';
                errBox.classList.add('show');
            }

        } catch {
            errBox.textContent = 'Cannot connect to server. Make sure it is running.';
            errBox.classList.add('show');
        }

        btn.disabled    = false;
        btn.textContent = 'Continue';
    }

    // ── Step 2: Reset password ───────────────────────────────────
    async function resetPassword() {
        const newPass     = document.getElementById('fpNewPass').value;
        const confirmPass = document.getElementById('fpConfirm').value;
        const errBox      = document.getElementById('s2Error');
        const btn         = document.getElementById('s2Btn');

        errBox.classList.remove('show');

        if (!newPass || !confirmPass) {
            errBox.textContent = 'Please fill in both password fields.';
            errBox.classList.add('show');
            return;
        }
        if (newPass.length < 8) {
            errBox.textContent = 'Password must be at least 8 characters.';
            errBox.classList.add('show');
            return;
        }
        if (newPass !== confirmPass) {
            errBox.textContent = 'Passwords do not match.';
            errBox.classList.add('show');
            return;
        }

        btn.disabled    = true;
        btn.textContent = 'Updating...';

        try {
            const res  = await fetch(`${API_BASE}/forgot-password`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email: confirmedEmail, newPassword: newPass })
            });
            const data = await res.json();

            if (res.ok) {
                goStep(3);
            } else {
                errBox.textContent = data.message || 'Reset failed. Try again.';
                errBox.classList.add('show');
            }

        } catch {
            errBox.textContent = 'Cannot connect to server. Make sure it is running.';
            errBox.classList.add('show');
        }

        btn.disabled    = false;
        btn.textContent = 'Reset Password';
    }

    // ── Password strength checker ────────────────────────────────
    function checkStrength(val) {
        const bar   = document.getElementById('strengthBar');
        const label = document.getElementById('strengthLabel');
        let score   = 0;
        if (val.length >= 8)              score++;
        if (/[A-Z]/.test(val))            score++;
        if (/[0-9]/.test(val))            score++;
        if (/[^A-Za-z0-9]/.test(val))    score++;

        const levels = [
            { pct: '0%',   color: '#e0e0e0', text: '' },
            { pct: '33%',  color: '#e74c3c', text: 'Weak' },
            { pct: '66%',  color: '#f39c12', text: 'Medium' },
            { pct: '100%', color: '#27ae60', text: 'Strong' },
            { pct: '100%', color: '#1a8a4a', text: 'Very Strong' },
        ];
        const lvl   = levels[Math.min(score, 4)];
        bar.style.width      = lvl.pct;
        bar.style.background = lvl.color;
        label.textContent    = lvl.text;
        label.style.color    = lvl.color;
    }

    // ── Toggle password visibility ───────────────────────────────
    function togglePw(id, span) {
        const input = document.getElementById(id);
        if (input.type === 'password') {
            input.type      = 'text';
            span.textContent = 'Hide';
        } else {
            input.type      = 'password';
            span.textContent = 'Show';
        }
    }

    // ── Allow Enter key on email field ───────────────────────────
    document.getElementById('fpEmail').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') checkEmail();
    });
</script>
</body>
</html>
