<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIRIS — Set Your Password</title>
<style>
  :root { --navy: #1e3c72; --navy-dark: #14294f; --accent: #2f7fd1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--navy-dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    width: 380px;
    border-radius: 12px;
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .brand { text-align: center; margin-bottom: 8px; }
  .brand h1 { font-size: 19px; color: var(--navy); }
  .brand span { color: var(--accent); }
  .subtitle { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 22px; }
  label { font-size: 13px; color: #334155; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .hint { font-size: 12px; color: #94a3b8; margin: -10px 0 16px; }
  button {
    width: 100%;
    padding: 11px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent); }
  .msg {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .error { background: #fef2f2; color: #b91c1c; }
  .success { background: #f0fdf4; color: #15803d; }
</style>
</head>
<body>

<div class="card">
  <div class="brand"><h1><span>◆</span> CIRIS</h1></div>
  <p class="subtitle">This is your first login. Set a new password to continue.</p>

  <div class="msg" id="msgBox"></div>

  <label for="currentPassword">Temporary password</label>
  <input type="password" id="currentPassword">

  <label for="newPassword">New password</label>
  <input type="password" id="newPassword">
  <p class="hint">Use a mix of upper/lowercase letters, a number, and a symbol.</p>

  <label for="confirmPassword">Confirm new password</label>
  <input type="password" id="confirmPassword">

  <button onclick="setNewPassword()">Set password and continue</button>
</div>

<script>
function getSession() {
    const raw = localStorage.getItem('user_session') || sessionStorage.getItem('user_session');
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
}

async function setNewPassword() {
    const session = getSession();
    if (!session || !session.token) {
        window.location.href = 'municipal-login.html';
        return;
    }

    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const msgBox = document.getElementById('msgBox');
    msgBox.style.display = 'none';

    if (!currentPassword || !newPassword || !confirmPassword) {
        showMsg('Please fill in all fields.', 'error');
        return;
    }
    if (newPassword !== confirmPassword) {
        showMsg('New passwords do not match.', 'error');
        return;
    }

    try {
        const res = await fetch('http://localhost:3000/change-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.token}`
            },
            body: JSON.stringify({
                id: session.id,
                currentPassword,
                newPassword
            })
        });
        const data = await res.json();

        if (!res.ok) {
            showMsg(data.message || 'Could not set password.', 'error');
            return;
        }

        // Update the stored session so must_change_password no longer
        // gates access, then continue to the real dashboard.
        session.must_change_password = false;
        localStorage.setItem('user_session', JSON.stringify(session));

        showMsg('Password set. Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'municipal-dashboard.html'; }, 1200);

    } catch (err) {
        console.error(err);
        showMsg('Could not connect to server.', 'error');
    }
}

function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg ' + type;
    box.style.display = 'block';
}
</script>
</body>
</html>
