<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .topbar-sub {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }
        .mark-all-btn {
            background: none;
            border: none;
            color: #1a3a6d;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 4px;
        }
        .mark-all-btn:hover { text-decoration: underline; }
        .mark-all-btn:disabled { opacity: 0.4; cursor: default; text-decoration: none; }

        .notif-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .notif-item.unread {
            background: #f5f9ff;
            border-color: #cfe1f7;
        }
        .notif-icon {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            background: #dbeafe;
            color: #1d4ed8;
        }
        .notif-body { flex: 1; min-width: 0; }
        .notif-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }
        .notif-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #0f172a;
        }
        .notif-date {
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .notif-message {
            font-size: 13px;
            color: #475569;
            margin-top: 3px;
            line-height: 1.4;
        }
        .notif-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: #1a3a6d;
            text-decoration: none;
        }
        .notif-link:hover { text-decoration: underline; }
        .notif-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a3a6d;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .notif-item:not(.unread) .notif-dot { visibility: hidden; }

        .empty-state {
            text-align: center;
            padding: 30px 15px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <a href="home.html" id="Menu">←</a>
        <div>Notifications</div>
        <div onclick="openSidebar()">👤</div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <span class="sidebar-close" onclick="closeSidebar()">&times;</span>

        <div class="sidebar-header">
            <div class="sidebar-avatar" id="sidebarAvatar">👤</div>
            <div>
                <div class="sidebar-name" id="sidebarName">Community Member</div>
                <div class="sidebar-subtext">CIRIS Account</div>
            </div>
        </div>

        <div class="sidebar-nav">
            <p onclick="goToProfile()">👤 Profile</p>
            <p onclick="window.location.href='feedback.html'">💬 Feedback</p>
            <p onclick="window.location.href='notifications.html'">🔔 Notifications</p>
        </div>

        <div class="sidebar-footer">
            <p onclick="logout()">🚪 Logout</p>
        </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

    <!-- CONTENT -->
    <div class="app-container">
        <div class="topbar-sub">
            <button class="mark-all-btn" id="markAllBtn" onclick="markAllRead()">✓✓ Mark all read</button>
        </div>

        <div id="notifList">
            <div class="empty-state">Loading notifications...</div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div id="bottom-tab">
        <a href="home.html" class="nav-item">🏠<br>HOME</a>
        <a href="report.html" class="nav-item">
            📄<br>REPORTS
            <span class="nav-badge" id="reportsBadge" style="display:none;"></span>
        </a>
        <a href="dash.html" class="nav-item nav-fab">
            <span class="nav-fab-circle">+</span>
            <span class="nav-fab-label">Report</span>
        </a>
        <a href="history.html" class="nav-item">🕘<br>HISTORY</a>
        <a href="profile.html" class="nav-item">👤<br>PROFILE</a>
    </div>

    <script src="script.js"></script>
    <script>
        const API_BASE = "http://localhost:3000";
        let notifications = [];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function formatDateTime(dateStr) {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return 'Unknown date';
            return d.toLocaleString('en-ZA', {
                day: 'numeric', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // Maps a notification's type to how it looks and where it links.
        // Right now the only personal type is "feedback_reply", but this
        // stays generic in case more personal notification types are
        // added later.
        function notifPresentation(n) {
            if (n.type === 'feedback_reply') {
                return { icon: '💬', linkText: 'View Feedback ↗', url: 'feedback.html' };
            }
            return { icon: '🔔', linkText: 'View ↗', url: 'home.html' };
        }

        function renderNotifications() {
            const container = document.getElementById('notifList');

            if (notifications.length === 0) {
                container.innerHTML = `<div class="empty-state">You're all caught up — no notifications yet.</div>`;
                updateMarkAllState();
                return;
            }

            container.innerHTML = notifications.map(n => {
                const p = notifPresentation(n);
                return `
                    <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="openNotification(${n.id}, '${p.url}')">
                        <div class="notif-dot"></div>
                        <div class="notif-icon">${p.icon}</div>
                        <div class="notif-body">
                            <div class="notif-top">
                                <span class="notif-title">${escapeHtml(n.title)}</span>
                                <span class="notif-date">${formatDateTime(n.date)}</span>
                            </div>
                            <div class="notif-message">${escapeHtml(n.message)}</div>
                            <a href="${p.url}" class="notif-link" onclick="event.stopPropagation();">${p.linkText}</a>
                        </div>
                    </div>
                `;
            }).join('');

            updateMarkAllState();
        }

        function updateMarkAllState() {
            const btn = document.getElementById('markAllBtn');
            if (!btn) return;
            btn.disabled = !notifications.some(n => !n.is_read);
        }

        async function loadNotifications() {
            const container = document.getElementById('notifList');
            try {
                const res = await fetch(`${API_BASE}/my-notifications`, {
                    headers: authHeaders()
                });

                if (res.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }
                if (!res.ok) throw new Error('Failed to load');

                const items = await res.json();
                notifications = Array.isArray(items) ? items : [];
                renderNotifications();

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="empty-state">Could not load notifications.</div>`;
            }
        }

        async function openNotification(id, url) {
            const n = notifications.find(x => x.id === id);
            if (n && !n.is_read) {
                n.is_read = true;
                try {
                    await fetch(`${API_BASE}/my-notifications/${id}/read`, {
                        method: 'PATCH',
                        headers: authHeaders()
                    });
                } catch (err) {
                    console.error(err);
                }
            }
            window.location.href = url;
        }

        async function markAllRead() {
            const unreadIds = notifications.filter(n => !n.is_read).map(n => n.id);
            if (unreadIds.length === 0) return;

            notifications.forEach(n => n.is_read = true);
            renderNotifications();

            try {
                await fetch(`${API_BASE}/my-notifications/mark-all-read`, {
                    method: 'PATCH',
                    headers: authHeaders()
                });
            } catch (err) {
                console.error(err);
            }
        }

        window.addEventListener('load', () => {
            const user = getCurrentUser();
            if (!user) {
                alert('You need to log in first.');
                window.location.href = 'login.html';
                return;
            }

            const nameEl = document.getElementById('sidebarName');
            if (nameEl) {
                nameEl.textContent = user.first_name
                    ? `${user.first_name} ${user.last_name || ''}`.trim()
                    : (user.email || 'Community Member');
            }
            updateSidebarAvatar(user);

            loadNotifications();
        });
    </script>
</body>
</html>
