<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        .profile-pic-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 12px;
        }
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1a3a6d;
            background: #e2e8f0;
            display: block;
        }
        .pic-edit-btn {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 34px;
            height: 34px;
            background: #1a3a6d;
            color: white;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .profile-name {
            font-size: 18px;
            font-weight: bold;
            color: #0f172a;
        }
        .profile-id {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .edit-form {
            background: white;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 13px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a3a6d;
            box-shadow: 0 0 0 3px rgba(26,58,109,0.08);
        }
        .section-subtitle {
            font-size: 15px;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 14px;
        }
        .btn-save {
            width: 100%;
            padding: 14px;
            background: #1a3a6d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(26,58,109,0.25);
        }
        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 13px;
            display: none;
        }
        .alert.show { display: block; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        .alert-error { background: #fee; color: #c33; border: 1px solid #fcc; }
        .alert-info { background: #f0f7ff; color: #004085; border: 1px solid #cce5ff; }
        .strength-meter {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
        }
        .weak { background: #e74c3c; width: 33%; }
        .medium { background: #f39c12; width: 66%; }
        .strong { background: #27ae60; width: 100%; }
        #ruleList {
            display: none;
            font-size: 12px;
            color: #c33;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
        }
        .header div:last-child {
            cursor: pointer;
        }
        .readonly-field {
            background: #f8fafc !important;
            color: #64748b;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <a href="home.html" id="Menu">←</a>        
        <div>Profile</div>
        <div onclick="openSidebar()">👤</div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <span class="close-btn" onclick="closeSidebar()" style="position:absolute;top:15px;right:15px;font-size:22px;cursor:pointer;color:white;">&times;</span>
        <p onclick="goToProfile()">👤 Profile</p>
        <p onclick="logout()">🚪 Logout</p>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

    <!-- CONTENT -->
    <div class="app-container">

        <div class="profile-header">
            <div class="profile-pic-wrapper">
                <img src="" alt="Profile" class="profile-pic" id="profileImage" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22110%22 height=%22110%22%3E%3Crect width=%22110%22 height=%22110%22 fill=%22%23e2e8f0%22/%3E%3Ctext x=%2255%22 y=%2265%22 font-size=%2250%22 text-anchor=%22middle%22%3E👤%3C/text%3E%3C/svg%3E'">
                <div class="pic-edit-btn" onclick="document.getElementById('picInput').click()" title="Change photo">📷</div>
                <input type="file" id="picInput" accept="image/*" style="display:none" onchange="handlePicChange(event)">
            </div>
            <div class="profile-name" id="displayName">Loading...</div>
            <div class="profile-id">User ID: <span id="displayId">—</span></div>
        </div>

        <div class="alert alert-success" id="successAlert">Profile updated successfully.</div>
        <div class="alert alert-error" id="errorAlert"></div>

        <div class="edit-form">
            <div class="section-subtitle">Personal Information</div>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="editName" class="readonly-field" readonly>
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="editEmail" placeholder="your@email.com" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="editPhone" placeholder="0712345678" autocomplete="tel">
            </div>
        </div>

        <div class="edit-form">
            <div class="section-subtitle">Change Password</div>
            <div class="alert alert-info show" style="margin-bottom:14px;">Leave all password fields blank if you don't want to change it.</div>
            
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" placeholder="Enter current password" autocomplete="current-password">
            </div>
            
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Min 8 characters" autocomplete="new-password">
                <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
                <div id="ruleList"></div>
            </div>
            
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat new password" autocomplete="new-password">
            </div>
        </div>

        <button class="btn-save" id="saveBtn" onclick="saveProfile()">Save Changes</button>
    </div>

    <!-- BOTTOM TABS -->
    <div id="bottom-tab">
        <a href="home.html">🏠<br>HOME</a>
        <a href="report.html">📄<br>REPORTS</a>
        <a href="profile.html">👤<br>PROFILE</a>
    </div>

    <script src="script.js"></script>
    <script src="password-rules.js"></script>
    <script>
        const API_BASE = "http://localhost:3000";
        let profilePictureBase64 = "";
        let pictureChangedByUser = false;

        /* ── helpers ─────────────────────────────────────────── */

        function getDisplayName(user) {
            const parts = [];
            if (user.first_name) parts.push(user.first_name);
            if (user.last_name) parts.push(user.last_name);
            return parts.join(' ') || user.email || 'User';
        }

        function getCurrentUserSafe() {
            // Fallback in case script.js fails to load
            if (typeof getCurrentUser === 'function') return getCurrentUser();
            const raw = localStorage.getItem('user_session') || sessionStorage.getItem('user_session');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch (e) { return null; }
        }

        function showSuccess(msg) {
            const el = document.getElementById('successAlert');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function showError(msg) {
            console.error('Profile save error:', msg);
            const el = document.getElementById('errorAlert');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 6000);
        }

        function clearAlerts() {
            document.getElementById('successAlert').classList.remove('show');
            document.getElementById('errorAlert').classList.remove('show');
        }

        /* ── load / populate ─────────────────────────────────── */

        async function loadProfile() {
            const user = getCurrentUserSafe();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // 1. Paint immediately from cache so the user isn't staring at blanks
            populateFields(user);

            // 2. Fetch fresh data in the background
            try {
                const res = await fetch(`${API_BASE}/user/${user.id}`);
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error('Fetch failed: ' + res.status);
                }

                const data = await res.json();
                if (!data || !data.id) throw new Error('Invalid user data from server');

                // Merge into localStorage (keep local picture if user just picked one)
                const merged = { ...user };
                ['id','first_name','last_name','email','phone'].forEach(k => {
                    if (data.hasOwnProperty(k)) merged[k] = data[k];
                });
                if (data.profile_picture && !pictureChangedByUser) {
                    merged.profile_picture = data.profile_picture;
                }
                localStorage.setItem('user_session', JSON.stringify(merged));

                // Update display header (never touches form inputs the user may be editing)
                document.getElementById('displayName').textContent = getDisplayName(merged);
                document.getElementById('displayId').textContent = merged.id || '—';

                // Only update picture if the user hasn't manually changed it
                if (!pictureChangedByUser) {
                    if (merged.profile_picture) {
                        document.getElementById('profileImage').src = merged.profile_picture;
                        profilePictureBase64 = merged.profile_picture;
                    }
                }

                // Only update form inputs if they still match the old cached values
                // (prevents the background fetch from wiping edits the user is typing)
                const emailEl = document.getElementById('editEmail');
                const phoneEl = document.getElementById('editPhone');
                if (emailEl.value === (user.email || '')) emailEl.value = merged.email || '';
                if (phoneEl.value === (user.phone || ''))  phoneEl.value = merged.phone  || '';

            } catch (e) {
                console.log('Background refresh failed, using cache:', e.message);
            }
        }

        function populateFields(user) {
            document.getElementById('displayName').textContent = getDisplayName(user);
            document.getElementById('displayId').textContent = user.id || '—';
            document.getElementById('editName').value = getDisplayName(user);
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editPhone').value = user.phone || '';
            
            profilePictureBase64 = user.profile_picture || "";
            pictureChangedByUser = false;
            if (user.profile_picture) {
                document.getElementById('profileImage').src = user.profile_picture;
            }
        }

        /* ── picture upload ──────────────────────────────────── */

        function handlePicChange(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (file.size > 2 * 1024 * 1024) {
                showError('Image must be smaller than 2MB.');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                pictureChangedByUser = true;
                profilePictureBase64 = e.target.result;
                document.getElementById('profileImage').src = profilePictureBase64;
            };
            reader.onerror = function() {
                showError('Could not read image. Try another file.');
            };
            reader.readAsDataURL(file);
        }

        /* ── save ────────────────────────────────────────────── */

        async function saveProfile() {
            clearAlerts();
            const user = getCurrentUserSafe();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const btn = document.getElementById('saveBtn');
            const email = document.getElementById('editEmail').value.trim();
            const phone = document.getElementById('editPhone').value.trim();
            const currentPw = document.getElementById('currentPassword').value;
            const newPw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('confirmPassword').value;

            /* validation */
            if (!email) {
                showError('Email address is required.');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('Please enter a valid email address.');
                return;
            }
            if (phone && !/^(\+27|0)[6-8][0-9]{8}$/.test(phone)) {
                showError('Please enter a valid South African phone number (e.g. 0712345678).');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Saving...';
            let profileUpdated = false;

            try {
                /* ── 1. Profile info ───────────────────────────── */
                const body = { id: user.id, email: email, phone: phone || null };
                if (profilePictureBase64) body.profile_picture = profilePictureBase64;

                const profileRes = await fetch(`${API_BASE}/update-profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                let profileData = {};
                const contentType = profileRes.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    try { profileData = await profileRes.json(); } catch(e) {}
                }

                if (!profileRes.ok) {
                    console.error('Server responded:', profileRes.status, profileData);
                    throw new Error(profileData.message || `Server error (${profileRes.status})`);
                }

                profileUpdated = true;

                // Refresh localStorage with server truth
                const updatedUser = { 
                    ...user, 
                    email: email, 
                    phone: phone || null 
                };
                if (profilePictureBase64) updatedUser.profile_picture = profilePictureBase64;
                if (profileData.user) {
                    if (profileData.user.first_name !== undefined) updatedUser.first_name = profileData.user.first_name;
                    if (profileData.user.last_name  !== undefined) updatedUser.last_name  = profileData.user.last_name;
                }
                localStorage.setItem('user_session', JSON.stringify(updatedUser));

                // Refresh display name in case server changed something
                document.getElementById('displayName').textContent = getDisplayName(updatedUser);

                /* ── 2. Password (only if any field filled) ────── */
                const pwFields = [currentPw, newPw, confirmPw];
                const filledCount = pwFields.filter(Boolean).length;

                if (filledCount > 0) {
                    if (filledCount < 3) {
                        throw new Error('To change your password, please fill in all three password fields.');
                    }
                    if (newPw !== confirmPw) {
                        throw new Error('New passwords do not match.');
                    }
                    
                    const strength = checkPasswordStrength(newPw);
                    if (!strength.valid) {
                        throw new Error('New password does not meet the requirements above.');
                    }

                    const pwRes = await fetch(`${API_BASE}/change-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id: user.id,
                            currentPassword: currentPw,
                            newPassword: newPw
                        })
                    });

                    let pwData = {};
                    const ct = pwRes.headers.get('content-type') || '';
                    if (ct.includes('application/json')) {
                        try { pwData = await pwRes.json(); } catch(e) {}
                    }

                    if (!pwRes.ok) {
                        throw new Error(pwData.message || 'Failed to change password');
                    }

                    // Clear password fields on success
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                    document.getElementById('strengthBar').style.width = '0';
                    document.getElementById('strengthBar').className = 'strength-bar';
                    const rl = document.getElementById('ruleList');
                    if (rl) { rl.style.display = 'none'; rl.innerHTML = ''; }
                }

                pictureChangedByUser = false;
                showSuccess('Profile updated successfully.');

            } catch (err) {
                if (profileUpdated && err.message && err.message.toLowerCase().includes('password')) {
                    showError('Profile saved, but password was not changed: ' + err.message);
                } else {
                    showError(err.message || 'Could not save. Please check your connection and try again.');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        }

        /* ── init ────────────────────────────────────────────── */

        if (typeof bindPasswordStrengthUI === 'function') {
            bindPasswordStrengthUI('newPassword', 'strengthBar', 'ruleList', null);
        }

        window.addEventListener('load', loadProfile);
    </script>
</body>
</html>
