<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">

<title>Reports</title>

</head>

<body>

<div class="app-container">

  
    <!-- HEADER -->
    <div class="header">
    <a href="#" id="Menu" onclick="openSidebar()">☰</a>        
        <div>Reports</div>
        <div>👤</div>
    </div>
   
<!-- Sidebar -->
<div id="sidebar" class="sidebar">
  <span class="sidebar-close" onclick="closeSidebar()">&times;</span>

  <div class="sidebar-header">
    <div class="sidebar-avatar" id="sidebarAvatar">👤</div>
    <div>
      <div class="sidebar-name" id="sidebarName">Community Member</div>
      <div class="sidebar-subtext">CIRIS Account</div>
    </div>
  </div>

  <div class="sidebar-nav">
    <p onclick="goToProfile()">👤 Profile</p>
    <p onclick="window.location.href='feedback.html'">💬 Feedback</p>
  </div>

  <div class="sidebar-footer">
    <p onclick="logout()">🚪 Logout</p>
  </div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closeSidebar()"></div>


    <!-- CONTENT -->
    <div class="content">

        <div class="section-title">Report Infrastructure Problem</div>

        <!-- DESCRIPTION -->
        <textarea id="description" rows="4" placeholder="Describe the infrastructure issue (e.g. pothole, broken pipe, street light fault)"></textarea>

        <!-- IMAGE CAPTURE -->
        <button class="action-btn" onclick="chooseImageSource()">
            📷 Add Photo
        </button>

        <div class="preview" id="previewBox">
            No image captured
        </div>

        <!-- LOCATION — read from the photo's GPS metadata; falls back to
             one device reading only if the photo has none (see script.js) -->
        <div class="gps-box" id="gpsBox">
            📍 Location will be taken from your photo
        </div>

        <!-- SUBMIT -->
        <button type="button" class="action-btn" onclick="submitReport()">
             Submit Infrastructure Report
        </button>

         <div id="successMessage" class="success-message">
        Report successfully submitted
         </div>

        
    </div>
<!-- BOTTOM NAV -->
<div id="bottom-tab">
    <a href="home.html" class="nav-item">🏠<br>HOME</a>
    <a href="report.html" class="nav-item">
        📄<br>REPORTS
        <span class="nav-badge" id="reportsBadge" style="display:none;"></span>
    </a>
    <a href="dash.html" class="nav-item nav-fab">
        <span class="nav-fab-circle">+</span>
        <span class="nav-fab-label">Report</span>
    </a>
    <a href="history.html" class="nav-item">🕘<br>HISTORY</a>
    <a href="profile.html" class="nav-item">👤<br>PROFILE</a>
</div>

</div>

<script src="api-config.js"></script>
<script src="exif-gps.js"></script>
<script src="image-utils.js"></script>
<script src="script.js"></script>
</body>
</html>
