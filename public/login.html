<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Portal - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 35px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            margin: 20px 25px 0;
            border-radius: 10px;
            padding: 4px;
            position: relative;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #666;
            transition: all 0.3s;
            z-index: 2;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .tab.active {
            color: white;
        }

        .tab-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 8px;
            transition: transform 0.3s;
            z-index: 1;
        }

        .tab-slider.right {
            transform: translateX(100%);
        }

        .forms-container {
            position: relative;
            height: 520px;
            overflow: hidden;
        }

        .form-panel {
            position: absolute;
            width: 100%;
            padding: 25px;
            transition: all 0.4s ease;
        }

        .form-panel.login {
            left: 0;
            opacity: 1;
        }

        .form-panel.register {
            left: 100%;
            opacity: 0;
        }

        .forms-container.show-register .form-panel.login {
            left: -100%;
            opacity: 0;
        }

        .forms-container.show-register .form-panel.register {
            left: 0;
            opacity: 1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 13px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        .password-field {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            font-size: 13px;
            font-weight: 500;
            user-select: none;
        }

        .show-password:hover {
            color: #2a5298;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0;
            font-size: 13px;
        }

        /* The register form (with the POPIA consent box) is taller than login */
        .forms-container {
            transition: height 0.4s ease;
        }
        .forms-container.show-register {
            height: 700px;
        }

        .consent-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 4px 0 16px;
            padding: 12px;
            background: #f5f8fd;
            border: 1px solid #d6e2f3;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 400;
            line-height: 1.45;
            color: #444;
            cursor: pointer;
        }
        .consent-box input {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            margin-top: 2px;
            accent-color: #2a5298;
            cursor: pointer;
        }
        .consent-box.consent-missing {
            border-color: #e5a3a3;
            background: #fdf3f3;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
            cursor: pointer;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: #2a5298;
            cursor: pointer;
        }

        .forgot {
            color: #2a5298;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .strength-meter {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
        }

        .weak { background: #e74c3c; width: 33%; }
        .medium { background: #f39c12; width: 66%; }
        .strong { background: #27ae60; width: 100%; }

        #registerRuleList {
            display: none;
            font-size: 12px;
            color: #c33;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
        }

        .info-box {
            background: #f0f7ff;
            border: 1px solid #cce5ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #004085;
        }

        .info-box strong {
            display: block;
            margin-bottom: 4px;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                min-height: 100vh;
            }
            
            .forms-container {
                height: auto;
                min-height: 520px;
            }

            .forms-container.show-register {
                height: 800px; /* consent text wraps onto more lines on phones */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Community Portal</h1>
            <p>Report infrastructure issues in your area</p>
        </div>

        <div class="tabs">
            <div class="tab-slider" id="slider"></div>
            <button type="button" class="tab active" onclick="switchTab('login')">Sign In</button>
            <button type="button" class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <div class="forms-container" id="formContainer">
            
            <!-- LOGIN -->
            <div class="form-panel login">
                <div class="info-box">
                    <strong>New User?</strong>
                    Please register first to create an account
                </div>
                <div class="alert alert-error" id="loginError">Invalid email or password</div>
                
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" name="email" placeholder="your@gmail.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-field">
                            <input type="password" id="loginPassword" name="password" placeholder="Enter password" required autocomplete="current-password">
                            <span class="show-password" onclick="togglePassword('loginPassword', this)">Show</span>
                        </div>
                    </div>

                    <div class="options">
                        <label class="remember">
                            <input type="checkbox" id="rememberMe" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="forgortpassword.html" class="forgot">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-submit" id="loginBtn">Sign In</button>
                </form>
            </div>

            <!-- REGISTER -->
            <div class="form-panel register">
                <div class="alert alert-success" id="registerSuccess">Account created! Please sign in.</div>
                <div class="alert alert-error" id="registerError">Registration failed. Try again.</div>

                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="John Doe" required autocomplete="name">
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email Address</label>
                        <input type="email" id="registerEmail" name="email" placeholder="your@email.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="012 345 6789" autocomplete="tel">
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <div class="password-field">
                            <input type="password" id="registerPassword" name="password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
                            <span class="show-password" onclick="togglePassword('registerPassword', this)">Show</span>
                        </div>
                        <div class="strength-meter">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <div id="registerRuleList"></div>
                    </div>

                    <label class="consent-box" id="consentBox" for="popiaConsent">
                        <input type="checkbox" id="popiaConsent" name="popia_consent" required>
                        <span>I consent to CIRIS processing my contact and location information for municipal service delivery in compliance with the Protection of Personal Information Act (POPIA).</span>
                    </label>

                    <button type="submit" class="btn-submit" id="registerBtn" disabled>Create Account</button>
                </form>
            </div>
        </div>
    </div>

   <script src="api-config.js"></script>
   <script src="login-lock.js"></script>
   <script src="password-rules.js"></script>
   <script>
// ============================================
// CONFIG (CHANGE THIS TO YOUR BACKEND URL)
// ============================================


// ============================================
// UI FUNCTIONS (UNCHANGED)
// ============================================
function switchTab(tab) {
    const slider = document.getElementById('slider');
    const container = document.getElementById('formContainer');
    const tabs = document.querySelectorAll('.tab');

    if (tab === 'register') {
        slider.classList.add('right');
        container.classList.add('show-register');
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
    } else {
        slider.classList.remove('right');
        container.classList.remove('show-register');
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
    }
}

function togglePassword(inputId, span) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        span.textContent = 'Hide';
    } else {
        input.type = 'password';
        span.textContent = 'Show';
    }
}

document.getElementById('popiaConsent').addEventListener('change', function () {
    if (this.checked) document.getElementById('consentBox').classList.remove('consent-missing');
});

// Live password strength check + disable submit until it passes
bindPasswordStrengthUI('registerPassword', 'strengthBar', 'registerRuleList', 'registerBtn');


// ============================================
// LOGIN (REAL DATABASE)
// ============================================
// Countdown shown while the server has paused sign-in after 5 wrong passwords
const loginLock = createLoginLock({
    storageKey: 'ciris_login_lock_until',
    button: document.getElementById('loginBtn'),
    idleLabel: 'Sign In',
    showMessage: text => {
        const error = document.getElementById('loginError');
        error.textContent = text;
        error.className = 'alert alert-error show';
    },
    clearMessage: () => document.getElementById('loginError').classList.remove('show')
});
loginLock.resume();

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('loginBtn');
    const error = document.getElementById('loginError');

    if (loginLock.isLocked()) return;

    const email = loginEmail.value.trim();
    const password = loginPassword.value;

    if (!email || !password) {
        error.textContent = 'Please fill in all fields';
        error.classList.add('show');
        return;
    }

    error.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
        const res = await fetch(`${API_BASE}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await readJsonSafely(res);
        if (!data) {
            throw new Error("Could not reach the CIRIS server. Make sure it's running (npm start) and try again.");
        }

        if (res.ok) {
            // Staff accounts have valid credentials but belong on the
            // municipal portal — mirrors the check in municipal-login.html.
            if (data.role !== 'community_member') {
                error.innerHTML = 'This is a municipal staff account. Please sign in on the <a href="municipal-login.html" style="color:inherit; text-decoration:underline; font-weight:600;">municipal portal</a>.';
                error.className = "alert alert-error show";
                btn.disabled = false;
                btn.textContent = 'Sign In';
                return;
            }

            sessionStorage.setItem("user_session", JSON.stringify(data));

            error.textContent = "Login successful!";
            error.className = "alert alert-success show";

            setTimeout(() => {
                window.location.replace("home.html");
            }, 1000);

        } else if (res.status === 429 && data.retry_after) {
            loginLock.start(data.retry_after);
        } else {
            throw new Error(data.message || "Login failed");
        }

    } catch (err) {
        error.textContent = err.message;
        error.className = "alert alert-error show";
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
});


// ============================================
// REGISTER (REAL DATABASE)
// ============================================
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('registerBtn');
    const success = document.getElementById('registerSuccess');
    const error = document.getElementById('registerError');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('registerEmail');
    const passwordInput = document.getElementById('registerPassword');
    const phoneInput = document.getElementById('phone');

    const fullName = fullNameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const phone = phoneInput.value.trim();

    if (!fullName || !email || !password) {
        error.textContent = 'Please fill all required fields';
        error.classList.add('show');
        success.classList.remove('show');
        return;
    }

    // POPIA: an account can only be created with explicit consent
    // (the server rejects registrations without it too).
    const consentInput = document.getElementById('popiaConsent');
    const consentBox = document.getElementById('consentBox');
    if (!consentInput.checked) {
        error.textContent = 'Please tick the POPIA consent box to create your account.';
        error.classList.add('show');
        success.classList.remove('show');
        consentBox.classList.add('consent-missing');
        return;
    }
    consentBox.classList.remove('consent-missing');

    // Client-side gate (server re-checks this too — never trust the client alone)
    const strength = checkPasswordStrength(password);
    if (!strength.valid) {
        error.textContent = 'Password does not meet the requirements above.';
        error.classList.add('show');
        success.classList.remove('show');
        return;
    }

    error.classList.remove('show');
    error.innerHTML = error.textContent; // reset any earlier injected HTML link
    btn.disabled = true;
    btn.textContent = 'Creating...';

    const names = fullName.split(" ");

    try {
        const res = await fetch(`${API_BASE}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                first_name: names[0],
                last_name: names.slice(1).join(" "),
                email,
                phone,
                password,
                popia_consent: consentInput.checked
            })
        });

        const data = await res.json();

        if (res.ok) {
            success.classList.add('show');
            error.classList.remove('show');
            this.reset();
            document.getElementById('registerRuleList').style.display = 'none';
            document.getElementById('strengthBar').style.width = '0';
            btn.textContent = 'Create Account';

            setTimeout(() => switchTab('login'), 1500);
            btn.disabled = false;
            return;

        }

        // Special-case duplicate email: point them toward signing in
        // instead of just telling them the email is taken.
        if (data.message === 'Email already exists') {
            error.innerHTML = 'That email is already registered. <a href="#" onclick="switchTab(\'login\'); return false;" style="color:#c33; text-decoration:underline; font-weight:600;">Sign in instead?</a>';
            error.classList.add('show');
            success.classList.remove('show');
            btn.disabled = false;
            btn.textContent = 'Create Account';
            return;
        }

        throw new Error(data.message || "Registration failed");

    } catch (err) {
        error.textContent = err.message;
        error.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Create Account';
    }
});


// ============================================
// SESSION RESET
// Opening the login page always starts a fresh login. It used to
// auto-redirect to home.html whenever a session was saved, which let the
// next person on the same device carry on as the previous user.
// ============================================
localStorage.removeItem("user_session");
sessionStorage.removeItem("user_session");
</script>
</body>
</html>
