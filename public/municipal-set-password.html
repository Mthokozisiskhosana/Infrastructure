<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIRIS — Set Your Password</title>
<style>
  :root { --navy: #1e3c72; --navy-dark: #14294f; --accent: #2f7fd1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--navy-dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    width: 380px;
    border-radius: 12px;
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .brand { text-align: center; margin-bottom: 8px; }
  .brand h1 { font-size: 19px; color: var(--navy); }
  .brand span { color: var(--accent); }
  .subtitle { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 22px; }
  label { font-size: 13px; color: #334155; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .password-field {
    position: relative;
  }
  .password-field input {
    padding-right: 42px;
    margin-bottom: 0;
  }
  .password-toggle {
    position: absolute;
    right: 8px;
    top: 0;
    bottom: 14px;
    width: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: #94a3b8;
  }
  .password-toggle:hover { color: #475569; }
  .password-toggle svg { width: 19px; height: 19px; }
  .hint { font-size: 12px; color: #94a3b8; margin: 6px 0 14px; }
  button.submit-btn {
    width: 100%;
    padding: 11px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.submit-btn:hover { background: var(--accent); }
  .msg {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .error { background: #fef2f2; color: #b91c1c; }
  .success { background: #f0fdf4; color: #15803d; }
</style>
</head>
<body>

<div class="card">
  <div class="brand"><h1><span>◆</span> CIRIS</h1></div>
  <p class="subtitle">This is your first login. Set a new password to continue.</p>

  <div class="msg" id="msgBox"></div>

  <label for="currentPassword">Temporary password</label>
  <div class="password-field">
    <input type="password" id="currentPassword">
    <button type="button" class="password-toggle" onclick="togglePassword('currentPassword', this)" aria-label="Show password"></button>
  </div>

  <label for="newPassword" style="margin-top:14px;">New password</label>
  <div class="password-field">
    <input type="password" id="newPassword">
    <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)" aria-label="Show password"></button>
  </div>
  <p class="hint">Use a mix of upper/lowercase letters, a number, and a symbol.</p>

  <label for="confirmPassword">Confirm new password</label>
  <div class="password-field">
    <input type="password" id="confirmPassword">
    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" aria-label="Show password"></button>
  </div>

  <button class="submit-btn" style="margin-top:16px;" onclick="setNewPassword()">Set password and continue</button>
</div>

<script src="api-config.js"></script>
<script>
const EYE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;

function initPasswordToggles() {
    document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.innerHTML = EYE_ICON;
    });
}

function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

function getSession() {
    const raw = sessionStorage.getItem('municipal_session');
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
}

async function setNewPassword() {
    const session = getSession();
    if (!session || !session.token) {
        window.location.href = 'municipal-login.html';
        return;
    }

    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const msgBox = document.getElementById('msgBox');
    msgBox.style.display = 'none';

    if (!currentPassword || !newPassword || !confirmPassword) {
        showMsg('Please fill in all fields.', 'error');
        return;
    }
    if (newPassword !== confirmPassword) {
        showMsg('New passwords do not match.', 'error');
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/change-password`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${session.token}`
            },
            body: JSON.stringify({
                id: session.id,
                currentPassword,
                newPassword
            })
        });
        const data = await res.json();

        if (!res.ok) {
            showMsg(data.message || 'Could not set password.', 'error');
            return;
        }

        // Update the stored session so must_change_password no longer
        // gates access, then continue to the real dashboard.
        session.must_change_password = false;
        sessionStorage.setItem('municipal_session', JSON.stringify(session));

        showMsg('Password set. Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'municipal-dashboard.html'; }, 1200);

    } catch (err) {
        console.error(err);
        showMsg('Could not connect to server.', 'error');
    }
}

function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg ' + type;
    box.style.display = 'block';
}

initPasswordToggles();
</script>
</body>
</html>
