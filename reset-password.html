<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Community Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        .container {
            background: white; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%; max-width: 420px; overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; padding: 35px; text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 6px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .body { padding: 25px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #444; font-weight: 600; font-size: 13px; }
        input[type="password"] {
            width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 15px; font-family: inherit;
        }
        input:focus { outline: none; border-color: #2a5298; box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1); }
        .password-field { position: relative; }
        .show-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #666; font-size: 13px; font-weight: 500; user-select: none;
        }
        .show-password:hover { color: #2a5298; }
        .strength-meter { height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0; transition: all 0.3s; }
        .weak { background: #e74c3c; width: 33%; }
        .medium { background: #f39c12; width: 66%; }
        .strong { background: #27ae60; width: 100%; }
        #ruleList { display: none; font-size: 12px; color: #c33; background: #fee; border: 1px solid #fcc; border-radius: 8px; padding: 10px; margin-top: 8px; }
        .btn-submit {
            width: 100%; padding: 14px; margin-top: 8px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; border: none; border-radius: 8px; font-size: 16px;
            font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .alert.show { display: block; }
        .alert-success { background: #efe; color: #3c3; border: 1px solid #cfc; }
        .alert-error { background: #fee; color: #c33; border: 1px solid #fcc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Set New Password</h1>
            <p>Choose a new, strong password</p>
        </div>
        <div class="body">
            <div class="alert alert-error" id="tokenError">This reset link is invalid or has expired. Please request a new one.</div>
            <div class="alert alert-success" id="successAlert">Password updated! Redirecting to sign in...</div>
            <div class="alert alert-error" id="submitError"></div>

            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-field">
                        <input type="password" id="newPassword" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
                        <span class="show-password" onclick="togglePassword('newPassword', this)">Show</span>
                    </div>
                    <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
                    <div id="ruleList"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn" disabled>Update Password</button>
            </form>
        </div>
    </div>

    <script src="password-rules.js"></script>
    <script>
        const API_BASE = "http://localhost:3000";

        function togglePassword(inputId, span) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') { input.type = 'text'; span.textContent = 'Hide'; }
            else { input.type = 'password'; span.textContent = 'Show'; }
        }

        // Get token from the URL, e.g. reset-password.html?token=abc123
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('tokenError').classList.add('show');
            document.getElementById('resetForm').style.display = 'none';
        }

        // Live strength validation
        bindPasswordStrengthUI('newPassword', 'strengthBar', 'ruleList', 'submitBtn');

        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const submitError = document.getElementById('submitError');
            const successAlert = document.getElementById('successAlert');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            submitError.classList.remove('show');

            const result = checkPasswordStrength(newPassword);
            if (!result.valid) {
                submitError.textContent = "Password does not meet the requirements above.";
                submitError.classList.add('show');
                return;
            }

            if (newPassword !== confirmPassword) {
                submitError.textContent = "Passwords do not match.";
                submitError.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const res = await fetch(`${API_BASE}/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password: newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    successAlert.classList.add('show');
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(() => { window.location.href = "login.html"; }, 2000);
                } else {
                    throw new Error(data.message || "Could not reset password");
                }

            } catch (err) {
                submitError.textContent = err.message;
                submitError.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
